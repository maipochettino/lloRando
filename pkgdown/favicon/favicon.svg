<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Logo de lloRando, opción lluvia de datos" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#32307a"/>
      <stop offset="1" stop-color="#12142b"/>
    </radialGradient>
    <linearGradient id="nube" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>
  <circle cx="120" cy="120" r="116" fill="url(#bg)"/>
  <circle cx="120" cy="120" r="116" fill="none" stroke="#a78bfa" stroke-width="3"/>

  <!-- Nube -->
  <g fill="url(#nube)">
    <circle cx="97" cy="84" r="18"/>
    <circle cx="121" cy="72" r="24"/>
    <circle cx="145" cy="84" r="19"/>
    <rect x="79" y="84" width="85" height="18" rx="9"/>
  </g>

  <!-- Lluvia que son datos -->
  <g stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round">
    <line x1="88"  y1="113" x2="88"  y2="138"/>
    <line x1="101" y1="113" x2="101" y2="150"/>
    <line x1="114" y1="113" x2="114" y2="132"/>
    <line x1="127" y1="113" x2="127" y2="158"/>
    <line x1="140" y1="113" x2="140" y2="143"/>
    <line x1="153" y1="113" x2="153" y2="134"/>
  </g>
  <g fill="#f5f3ff">
    <circle cx="88"  cy="143" r="3"/>
    <circle cx="101" cy="155" r="3"/>
    <circle cx="114" cy="137" r="3"/>
    <circle cx="127" cy="163" r="3"/>
    <circle cx="140" cy="148" r="3"/>
    <circle cx="153" cy="139" r="3"/>
  </g>

  <!-- Nombre -->
  <text x="120" y="197" text-anchor="middle"
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-size="25" letter-spacing="2.5" fill="#f5f3ff">llo<tspan fill="#a78bfa" font-weight="700">R</tspan>ando</text>
</svg>
